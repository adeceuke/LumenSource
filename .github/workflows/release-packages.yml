name: Release packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example, v1.0.0)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

jobs:
  release-metadata:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Validate tag and project versions
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)$ ]]; then
            echo "Release tags must use the form v1.2.3 (pre-release suffixes are allowed)." >&2
            exit 1
          fi
          version="${tag#v}"
          workspace_version="$(awk -F ' *= *' '/^version = / { gsub(/"/, "", $2); print $2; exit }' Cargo.toml)"
          if [[ "$workspace_version" != "$version" ]]; then
            echo "Tag $tag does not match Cargo workspace version $workspace_version." >&2
            exit 1
          fi
          desktop_cargo_version="$(awk -F ' *= *' '/^version = / { gsub(/"/, "", $2); print $2; exit }' apps/desktop/src-tauri/Cargo.toml)"
          if [[ "$desktop_cargo_version" != "$version" ]]; then
            echo "Tag $tag does not match desktop Cargo version $desktop_cargo_version." >&2
            exit 1
          fi
          node - "$version" <<'NODE'
          const fs = require("fs");
          const expected = process.argv[2];
          const files = [
            ["apps/desktop/package.json", JSON.parse(fs.readFileSync("apps/desktop/package.json"))],
            ["apps/desktop/src-tauri/tauri.conf.json", JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json"))],
          ];
          for (const [file, contents] of files) {
            if (contents.version !== expected) {
              throw new Error(`${file} version ${contents.version} does not match tag v${expected}`);
            }
          }
          NODE
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Test and package Windows
    needs: release-metadata
    if: ${{ vars.WINDOWS_SIGNING_ENABLED == 'true' }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Import release identity
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_PFX_BASE64) { throw "The Windows release identity is not configured." }
          $pfx = Join-Path $env:RUNNER_TEMP "lumensource-release.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
      - name: Run all checks and tests
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\container.ps1 check
      - name: Build and verify signed installers
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\package-release.ps1 -CertificateThumbprint $env:WINDOWS_CERTIFICATE_THUMBPRINT
      - name: Stage versioned release files
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          $releaseDirectory = (New-Item -ItemType Directory -Force release).FullName
          $msi = @(Get-ChildItem target\release\bundle\msi\*.msi)
          $nsis = @(Get-ChildItem target\release\bundle\nsis\*.exe)
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) {
            throw "Expected exactly one MSI and one NSIS installer."
          }
          Copy-Item $msi[0].FullName (Join-Path $releaseDirectory "LumenSource-$env:RELEASE_TAG-windows-x86_64.msi")
          Copy-Item $nsis[0].FullName (Join-Path $releaseDirectory "LumenSource-$env:RELEASE_TAG-windows-x86_64-setup.exe")
          Get-ChildItem $releaseDirectory -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content (Join-Path $releaseDirectory "SHA256SUMS-windows-x86_64.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.release-metadata.outputs.tag }}-windows-x86_64
          path: release/*
          if-no-files-found: error
          retention-days: 7

  ubuntu:
    name: Test and package Ubuntu
    needs: release-metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Run all checks, tests, and package verification
        run: scripts/package-release.sh
      - name: Stage versioned release files
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(target/release/bundle/deb/*.deb)
          appimages=(target/release/bundle/appimage/*.AppImage)
          if (( ${#debs[@]} != 1 || ${#appimages[@]} != 1 )); then
            echo "Expected exactly one deb and one AppImage package." >&2
            exit 1
          fi
          mkdir release
          cp "${debs[0]}" "release/LumenSource-${RELEASE_TAG}-ubuntu-24.04-x86_64.deb"
          cp "${appimages[0]}" "release/LumenSource-${RELEASE_TAG}-linux-x86_64.AppImage"
          (cd release && sha256sum ./* > SHA256SUMS-linux-x86_64.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.release-metadata.outputs.tag }}-linux-x86_64
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [release-metadata, windows, ubuntu]
    if: >-
      ${{
        always() &&
        needs.release-metadata.result == 'success' &&
        needs.ubuntu.result == 'success' &&
        (needs.windows.result == 'success' || needs.windows.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-${{ needs.release-metadata.outputs.tag }}-*
          path: release
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --verify-tag \
              --generate-notes \
              --notes "Official Linux packages are attached for this release. Windows remains supported from source; no unsigned Windows installer is distributed." \
              --title "Lumen Source $RELEASE_TAG"
          fi
