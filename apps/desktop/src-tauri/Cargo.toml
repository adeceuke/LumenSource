[package]
name = "lumen-source-desktop"
version = "1.0.2"
edition = "2021"
publish = false

[features]
default = ["desktop-runtime"]
desktop-runtime = ["tauri/wry"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8.8", features = ["json", "tokio", "http1"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
dirs = "6.0.0"
keyring = "4.1.5"
lumen-source-catalog = { version = "1.0.2", path = "../../../crates/lumen-source-catalog" }
lumen-source-hardware = { version = "1.0.2", path = "../../../crates/lumen-source-hardware" }
lumen-source-host = { version = "1.0.2", path = "../../../crates/lumen-source-host" }
lumen-source-recommend = { version = "1.0.2", path = "../../../crates/lumen-source-recommend" }
lumen-source-runtime = { version = "1.0.2", path = "../../../crates/lumen-source-runtime" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [], default-features = false }
tauri-plugin-opener = "2"
tokio = { version = "1.53.0", features = ["sync", "rt-multi-thread", "macros", "time", "fs", "net", "process", "io-util"] }
tokio-util = "0.7.18"
zeroize = { version = "1.8.2", features = ["std"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[dev-dependencies]
futures-util = "0.3.31"
tempfile = "3.27.0"

[lints]
workspace = true
