[package]
name = "lumen-source-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["desktop-runtime"]
desktop-runtime = ["tauri/wry"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
dirs = "6.0.0"
lumen-source-catalog = { version = "0.1.0", path = "../../../crates/lumen-source-catalog" }
lumen-source-hardware = { version = "0.1.0", path = "../../../crates/lumen-source-hardware" }
lumen-source-host = { version = "0.1.0", path = "../../../crates/lumen-source-host" }
lumen-source-recommend = { version = "0.1.0", path = "../../../crates/lumen-source-recommend" }
lumen-source-runtime = { version = "0.1.0", path = "../../../crates/lumen-source-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [], default-features = false }
tokio = { version = "1.53.0", features = ["sync", "rt-multi-thread", "macros", "time", "fs"] }

[lints]
workspace = true
