[package]
name = "lumen-source-catalog"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.91"
base64 = "0.22.1"
ed25519-dalek = "3.0.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
