[package]
name = "lumen-source-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.91"
lumen-source-hardware = { version = "0.7.0", path = "../lumen-source-hardware" }
lumen-source-runtime = { version = "0.7.0", path = "../lumen-source-runtime" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"

[dev-dependencies]
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }
