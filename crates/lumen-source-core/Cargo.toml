[package]
name = "lumen-source-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.91"
lumen-source-catalog = { version = "0.5.0", path = "../lumen-source-catalog" }
lumen-source-hardware = { version = "0.5.0", path = "../lumen-source-hardware" }
lumen-source-host = { version = "0.5.0", path = "../lumen-source-host" }
lumen-source-recommend = { version = "0.5.0", path = "../lumen-source-recommend" }
lumen-source-runtime = { version = "0.5.0", path = "../lumen-source-runtime" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["sync", "macros", "rt-multi-thread"] }
