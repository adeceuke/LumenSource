[package]
name = "lumen-source-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.91"
futures-util = "0.3.33"
hex = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["fs", "io-util", "process", "macros", "rt-multi-thread", "time", "sync"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
zstd = "0.13.3"
